[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "junior"
version = "2.0.0rc1"
description = "Native, local-first Junior 2.0 job discovery application"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{name = "Clayton Graves"}]
dependencies = [
    "PySide6>=6.8,<7",
    "PyYAML>=6.0,<7",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10,<7",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
junior = "junior.__main__:main"
junior-build-macos = "junior.packaging.macos:main"
junior-build-windows = "junior.packaging.windows:main"
junior-build-linux = "junior.packaging.linux:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"junior.catalog" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
