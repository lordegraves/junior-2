name: Build and release Junior

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            runner: windows-latest
            command: junior-build-windows
            artifact: dist/Junior-2.0-Windows-x86_64-Setup.exe
          - platform: macOS
            runner: macos-14
            command: junior-build-macos
            artifact: dist/Junior-2.0-macOS-*.dmg
          - platform: Linux
            runner: ubuntu-22.04
            command: junior-build-linux
            artifact: dist/Junior-2.0-Linux-*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0
      - run: python -m pip install -e ".[dev]"
      - if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - run: ${{ matrix.command }}
      - name: Smoke test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "Junior2Smoke"
          $dataRoot = Join-Path $env:RUNNER_TEMP "Junior2Data"
          Start-Process "dist/Junior-2.0-Windows-x86_64-Setup.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installRoot"
          $env:JUNIOR_DATA_DIR = $dataRoot
          $process = Start-Process (Join-Path $installRoot "Junior 2.0.exe") -PassThru
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            if (Test-Path (Join-Path $dataRoot "junior-2.sqlite3")) { break }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path (Join-Path $dataRoot "junior-2.sqlite3"))) { throw "Packaged app did not initialize its database." }
          Stop-Process -Id $process.Id -Force
          Start-Process (Join-Path $installRoot "unins000.exe") -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if (Test-Path (Join-Path $installRoot "Junior 2.0.exe")) { throw "Uninstaller left the application executable behind." }
      - name: Smoke test macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find dist -name 'Junior-2.0-macOS-*.dmg' -print -quit)
          mount_dir="$RUNNER_TEMP/Junior2Mount"
          app_dir="$RUNNER_TEMP/Junior 2.0.app"
          data_dir="$RUNNER_TEMP/Junior2Data"
          mkdir -p "$mount_dir"
          hdiutil attach "$dmg" -mountpoint "$mount_dir" -nobrowse
          test -d "$mount_dir/Junior 2.0.app"
          test -L "$mount_dir/Applications"
          cp -R "$mount_dir/Junior 2.0.app" "$app_dir"
          hdiutil detach "$mount_dir"
          QT_QPA_PLATFORM=offscreen JUNIOR_DATA_DIR="$data_dir" "$app_dir/Contents/MacOS/Junior 2.0" &
          app_pid=$!
          for attempt in $(seq 1 30); do
            test -f "$data_dir/junior-2.sqlite3" && break
            sleep 1
          done
          test -f "$data_dir/junior-2.sqlite3"
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package=$(find dist -name 'Junior-2.0-Linux-*.deb' -print -quit)
          data_dir="$RUNNER_TEMP/Junior2Data"
          sudo dpkg -i "$package"
          QT_QPA_PLATFORM=offscreen JUNIOR_DATA_DIR="$data_dir" '/opt/junior2/Junior 2.0' &
          app_pid=$!
          for attempt in $(seq 1 30); do
            test -f "$data_dir/junior-2.sqlite3" && break
            sleep 1
          done
          test -f "$data_dir/junior-2.sqlite3"
          kill "$app_pid"
          wait "$app_pid" || true
          sudo dpkg -r junior2
          test ! -e '/opt/junior2/Junior 2.0'
      - uses: actions/upload-artifact@v4
        with:
          name: Junior-2.0-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Junior-2.0-*
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
